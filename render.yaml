# Render Blueprint — deploys the SMS backend + frontend on Render's FREE instance type.
# The database is NOT on Render: it's a free Supabase Postgres (Render's own free
# Postgres is deleted after 30 days). Set DATABASE_URL by hand — see below.
#
# One-time setup: Render dashboard -> New -> Blueprint -> connect repo
# nilesh830/school-management-system, branch `main`. Render reads this file and
# creates both services, prompting for the `sync: false` env vars
# (see DEPLOYMENT.md "One-time: cutover from Railway").
#
# Free-tier behavior: services spin down after 15 min without traffic; the next
# request cold-starts them (~1 min). Upgrade plan to `starter` to avoid that.

services:
  # ---- Flask API (gunicorn) ----
  - type: web
    name: sms-backend
    runtime: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Mirrors backend/Procfile (Procfile itself is only read by Railway/Heroku).
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION # match local dev; psycopg3 (not psycopg2) because of 3.14
        value: 3.14.0
      - key: FLASK_ENV
        value: production
      # Supabase SESSION pooler URL (IPv4), port 5432:
      #   postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # MUST be the session pooler, NOT the transaction pooler (port 6543): the app
      # pins search_path per connection for schema-per-school, which transaction
      # pooling breaks. The direct db.<ref>.supabase.co host is IPv6-only and
      # unreachable from Render — use the pooler host.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS # set to the frontend URL after first deploy, e.g. https://sms-frontend-xxxx.onrender.com
        sync: false

  # ---- Angular SPA served by Caddy (also reverse-proxies /api/* to the backend) ----
  - type: web
    name: sms-frontend
    runtime: docker
    region: singapore
    plan: free
    branch: main
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BACKEND_URL # set to the backend URL after first deploy, e.g. https://sms-backend-xxxx.onrender.com
        sync: false
